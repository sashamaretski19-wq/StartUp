<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>OG source</title>
<style>
  *{box-sizing:border-box;margin:0;}
  body{
    width:1200px;height:630px;overflow:hidden;
    background:#FBFAF8;color:#111214;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;justify-content:center;
    padding:0 84px;position:relative;
  }
  .eyebrow{
    font-size:19px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
    color:#E8503A;margin-bottom:34px;
  }
  h1{font-size:74px;line-height:1.04;letter-spacing:-.036em;font-weight:600;max-width:15ch;}
  h1 em{font-style:normal;color:#E8503A;}
  .who{display:flex;align-items:center;gap:20px;margin-top:56px;}
  .who img{width:76px;height:76px;border-radius:50%;object-fit:cover;object-position:50% 22%;}
  .who b{display:block;font-size:23px;font-weight:600;margin-bottom:4px;}
  .who span{font-size:20px;color:#63676E;}
  .bars{position:absolute;right:84px;bottom:84px;display:flex;align-items:flex-end;gap:13px;height:170px;}
  .bars i{width:26px;background:#E9E5DE;border-radius:5px 5px 0 0;display:block;}
  .bars i.on{background:#E8503A;}
</style>
</head>
<body>
  <div class="eyebrow">Growth &amp; Unit-Economics Audit · consumer AI</div>
  <h1>Скажу, при каких допущениях твоя экономика <em>сходится</em></h1>
  <div class="who">
    <img src="images/photo.png" alt="">
    <div>
      <b>Саша Марецкий — CMO omnichannel retail</b>
      <span>Бюджет 10+ млн USD, каждый день трачу эти деньги сам</span>
    </div>
  </div>
  <div class="bars">
    <i style="height:26%"></i><i style="height:42%"></i><i style="height:55%"></i>
    <i style="height:67%"></i><i style="height:76%"></i>
    <i class="on" style="height:90%"></i><i class="on" style="height:100%"></i>
  </div>
</body>
</html>
